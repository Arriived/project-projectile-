[profile.default]
src = "contracts"
out = "out"
libs = ["node_modules"]
test = "test/invariant"

# Match hardhat.config.js exactly. Without these, forge compiled Ballista unoptimized
# while Hardhat (and any real deployment) compiled it at 200 runs -- so the invariant
# fuzzing was exercising different bytecode than the code that actually ships, and hit
# a stack-too-deep the production build does not have.
optimizer = true
optimizer_runs = 200
# Pin the compiler too, not just the optimizer. Without this forge resolves the ^0.8.24
# pragma to the newest available (0.8.35 as of writing) while hardhat.config.js pins
# 0.8.24 -- so the invariants were fuzzing bytecode no deployment will ever have. Same
# class of drift as the optimizer settings above, one field over.
solc_version = "0.8.24"

remappings = [
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "forge-std/=lib/forge-std/src/"
]

[invariant]
runs = 1000
depth = 250
fail_on_revert = false
