<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arc Launch — Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,620&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
<style>
  :root {
    --bg: #0A0F0D;
    --panel: #101613;
    --panel-raised: #141C18;
    --border: #212B26;
    --ink: #E7EEEA;
    --ink-dim: #7C8C84;
    --ink-faint: #4E5D56;
    --seal: #2BA383;
    --seal-dim: #1F6F5C;
    --seal-glow: rgba(43,163,131,0.12);
    --up: #2BA383;
    --down: #D9695C;
    --brass: #C99A54;
    --error: #D9695C;
    --radius: 4px;
  }
  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
  }
  ::selection { background: var(--seal-glow); }

  /* Header */
  header {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 20px;
    height: 56px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .wordmark {
    font-family: 'Fraunces', serif;
    font-weight: 620;
    font-size: 18px;
    white-space: nowrap;
  }
  .wordmark .dot { color: var(--seal); }
  .search-box {
    flex: 1;
    max-width: 420px;
  }
  .search-box input {
    width: 100%;
    background: var(--panel-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--ink);
    padding: 9px 12px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
  }
  .search-box input:focus-visible { outline: 2px solid var(--seal); outline-offset: 1px; }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .wallet-pill {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    background: var(--panel-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 12px;
    color: var(--ink-dim);
  }
  .wallet-pill.on { color: var(--seal); border-color: var(--seal-dim); }
  button.connect {
    background: var(--seal-dim);
    color: #EAFBF5;
    border: none;
    border-radius: var(--radius);
    padding: 9px 16px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  button.connect:hover { background: var(--seal); }
  button:focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; }

  /* Layout */
  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--border);
    max-width: 1280px;
    margin: 0 auto;
  }
  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; }
  }
  .column { background: var(--bg); }
  .column-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 56px;
    background: var(--bg);
    z-index: 10;
  }
  .column-head h2 {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 0;
    color: var(--ink);
  }
  .column-head .count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-faint);
  }
  .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--seal);
    display: inline-block;
    margin-right: 7px;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  .empty-state {
    padding: 40px 20px;
    text-align: center;
    color: var(--ink-faint);
    font-size: 13px;
    line-height: 1.6;
  }

  .row {
    display: grid;
    grid-template-columns: 34px 1fr auto auto;
    align-items: center;
    gap: 12px;
    padding: 11px 16px;
    border-bottom: 1px solid var(--border);
    transition: background 0.1s ease;
  }
  .row:hover { background: var(--panel); }

  .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 12px;
    color: #05100C;
    flex-shrink: 0;
  }

  .token-meta { min-width: 0; }
  .token-symbol {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 13.5px;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .token-name {
    font-size: 11.5px;
    color: var(--ink-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 220px;
  }
  .row-sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-faint);
    margin-top: 2px;
  }

  .col-stats { text-align: right; }
  .price {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--ink);
  }
  .progress-wrap {
    width: 74px;
    margin-top: 5px;
  }
  .progress-track {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--brass);
    border-radius: 2px;
    transition: width 0.4s ease;
  }
  .progress-label {
    font-size: 9.5px;
    color: var(--ink-faint);
    text-align: right;
    margin-top: 2px;
    font-family: 'IBM Plex Mono', monospace;
  }

  .badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    padding: 1.5px 5px;
    border-radius: 3px;
    border: 1px solid var(--border);
    color: var(--ink-faint);
  }
  .badge.warn { color: var(--brass); border-color: rgba(201,154,84,0.35); }

  .buy-btn {
    background: var(--panel-raised);
    border: 1px solid var(--seal-dim);
    color: var(--seal);
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 11.5px;
    padding: 7px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    white-space: nowrap;
  }
  .buy-btn:hover { background: var(--seal-dim); color: #EAFBF5; }

  /* Trade drawer */
  .drawer-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(5,10,8,0.72);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .drawer-backdrop.open { display: flex; }
  .drawer {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 100%;
    max-width: 380px;
    padding: 22px;
  }
  .drawer-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 18px;
  }
  .drawer-head .sym { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 15px; }
  .drawer-close {
    background: none; border: none; color: var(--ink-faint);
    font-size: 18px; cursor: pointer; line-height: 1; padding: 4px;
  }
  .preset-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .preset-btn {
    background: var(--panel-raised);
    border: 1px solid var(--border);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    font-weight: 600;
    padding: 10px 0;
    border-radius: var(--radius);
    cursor: pointer;
  }
  .preset-btn:hover, .preset-btn.active { border-color: var(--seal); color: var(--seal); }
  .drawer-detail {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--ink-dim);
    display: flex; justify-content: space-between;
    margin-bottom: 6px;
  }
  .drawer-confirm {
    width: 100%;
    background: var(--seal-dim);
    color: #EAFBF5;
    border: none;
    border-radius: var(--radius);
    padding: 13px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    margin-top: 12px;
  }
  .drawer-confirm:hover:not(:disabled) { background: var(--seal); }
  .drawer-confirm:disabled { opacity: 0.55; cursor: not-allowed; }
  .drawer-status {
    font-size: 12px;
    margin-top: 12px;
    min-height: 16px;
    line-height: 1.5;
  }
  .drawer-status.warn { color: var(--brass); }
  .drawer-status.error { color: var(--error); }
  .drawer-status.ok { color: var(--seal); }
  .spinner {
    width: 12px; height: 12px;
    border: 2px solid rgba(231,238,234,0.2);
    border-top-color: currentColor;
    border-radius: 50%;
    display: inline-block;
    animation: spin 0.7s linear infinite;
    vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="wordmark">Arc Launch<span class="dot">.</span></div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search by name or symbol…" autocomplete="off">
  </div>
  <div class="header-right">
    <span class="wallet-pill" id="allowancePill" style="display:none;"></span>
    <span class="wallet-pill" id="walletPill">Not connected</span>
    <button class="connect" id="connectBtn">Connect wallet</button>
  </div>
</header>

<main>
  <section class="column">
    <div class="column-head">
      <h2><span class="live-dot"></span>New Pairs</h2>
      <span class="count" id="newCount">—</span>
    </div>
    <div id="newList"></div>
  </section>

  <section class="column">
    <div class="column-head">
      <h2><span class="live-dot"></span>Graduating</h2>
      <span class="count" id="gradCount">—</span>
    </div>
    <div id="gradList"></div>
  </section>
</main>

<div class="drawer-backdrop" id="drawerBackdrop">
  <div class="drawer">
    <div class="drawer-head">
      <span class="sym" id="drawerSymbol">—</span>
      <button class="drawer-close" id="drawerClose" aria-label="Close">✕</button>
    </div>
    <div class="trust-badges" id="trustBadges" style="display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;"></div>
    <div id="chartContainer" style="margin-bottom:18px;">
      <svg id="chartSvg" viewBox="0 0 336 90" width="100%" height="90" style="display:block;"></svg>
      <div id="chartEmpty" style="display:none; text-align:center; font-size:11.5px; color:var(--ink-faint); padding:30px 0;">Not enough trade history yet.</div>
    </div>

    <div class="side-tabs" style="display:flex; gap:6px; margin-bottom:14px;">
      <button class="side-tab active" id="tabBuy" style="flex:1; padding:9px; border-radius:4px; border:1px solid var(--seal-dim); background:var(--seal-dim); color:#EAFBF5; font-family:'IBM Plex Sans',sans-serif; font-weight:600; font-size:13px; cursor:pointer;">Buy</button>
      <button class="side-tab" id="tabSell" style="flex:1; padding:9px; border-radius:4px; border:1px solid var(--border); background:var(--panel-raised); color:var(--ink-dim); font-family:'IBM Plex Sans',sans-serif; font-weight:600; font-size:13px; cursor:pointer;">Sell</button>

    <div class="preset-grid" id="presetGrid">
      <button class="preset-btn" data-pct="25">25%</button>
      <button class="preset-btn" data-pct="50">50%</button>
      <button class="preset-btn" data-pct="75">75%</button>
      <button class="preset-btn" data-pct="100">100%</button>

    <div style="margin-bottom:16px;">
      <input type="text" id="customAmount" placeholder="Custom amount" inputmode="decimal"
        style="width:100%; background:var(--panel-raised); border:1px solid var(--border); border-radius:4px; color:var(--ink); padding:10px 12px; font-family:'IBM Plex Mono',monospace; font-size:13px;">
    </div>

    <div class="drawer-detail"><span id="payLabel">You pay</span><span id="drawerPay">—</span></div>
    <div class="drawer-detail"><span id="receiveLabel">Est. receive</span><span id="drawerReceive">—</span></div>
    <div class="drawer-detail"><span>Min. received (slippage-protected)</span><span id="drawerMin">—</span></div>
    <div class="drawer-detail"><span id="balanceLabel">Your balance</span><span id="drawerBalance">—</span></div>
    <button class="drawer-confirm" id="drawerConfirm" disabled>Select an amount</button>
    <div class="drawer-status" id="drawerStatus"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://zohthxhjcvmrziwqaiev.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvaHRoeGhqY3Ztcnppd3FhaWV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4NDEzNzgsImV4cCI6MjEwMDQxNzM3OH0.IqVTo6KI2xTeIVrhmu56Rw-rwd0gDTH-malqgmIg2hA"; // Settings -> API Keys -> anon/public key. Safe to expose client-side — protected by Row Level Security, not secrecy.

const FACTORY_ADDRESS = "0x63C4c5b7D7add4dbE9Bf8f155711dd00F566Ec57";
const USDC_ADDRESS = "0x3600000000000000000000000000000000000000";
const CHAIN_ID_DEC = 5042002;
const CHAIN_ID_HEX = "0x" + CHAIN_ID_DEC.toString(16);
const RPC_URL = "https://rpc.testnet.arc.network";
const EXPLORER_URL = "https://testnet.arcscan.app";
const POLL_INTERVAL_MS = 6000;
const BPS_DENOMINATOR = 10000n;
const APPROVAL_BUDGET_USDC = 500; // when approval is needed, approve this much (or the
// trade size if larger) instead of the exact trade amount — trades under this ceiling
// afterward skip the approval step entirely. Bounded, not unlimited: never approves
// more than this fixed amount at a time, and can be revoked from the header at any time.
const TOTAL_TOKEN_SUPPLY = 1_000_000_000n * 10n ** 18n; // fixed supply, matches the contract exactly

const FACTORY_ABI = [
  "function buy(address token, uint256 usdcIn, uint256 minTokensOut)",
  "function sell(address token, uint256 tokensIn, uint256 minUsdcOut)",
];
const ERC20_ABI = [
  "function balanceOf(address) view returns (uint256)",
  "function allowance(address owner, address spender) view returns (uint256)",
  "function approve(address spender, uint256 amount) returns (bool)",
];

const $ = (id) => document.getElementById(id);

// ── Safe rendering helpers ──────────────────────────────────────────────
// Token name/symbol/description are supplied by WHOEVER created the token —
// any visitor to this page, not just the current user. Never insert them via
// innerHTML; always via textContent, so a hostile creator can't embed a
// script/HTML payload that runs in every other visitor's browser.
function el(tag, className, textContent) {
  const e = document.createElement(tag);
  if (className) e.className = className;
  if (textContent !== undefined) e.textContent = textContent;
  return e;
}

function short(addr) { return addr.slice(0, 6) + "…" + addr.slice(-4); }

function formatCompact(n) {
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + "M";
  if (n >= 1_000) return (n / 1_000).toFixed(1) + "K";
  return n.toFixed(0);
}

function relativeAge(isoString) {
  const secs = Math.floor((Date.now() - new Date(isoString).getTime()) / 1000);
  if (secs < 60) return secs + "s";
  if (secs < 3600) return Math.floor(secs / 60) + "m";
  if (secs < 86400) return Math.floor(secs / 3600) + "h";
  return Math.floor(secs / 86400) + "d";
}

function avatarColor(address) {
  // Deterministic color from the address, no external image dependency.
  let hash = 0;
  for (let i = 0; i < address.length; i++) hash = (hash * 31 + address.charCodeAt(i)) | 0;
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue}, 55%, 62%)`;
}

// ── Supabase REST fetch (read-only, anon key, RLS-protected) ───────────
async function fetchTokens(filterQuery) {
  const url = `${SUPABASE_URL}/rest/v1/tokens_with_volume?select=*&${filterQuery}`;
  const res = await fetch(url, {
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
    },
  });
  if (!res.ok) throw new Error(`Supabase fetch failed: ${res.status}`);
  return res.json();
}

// ── Curve math, mirrored exactly from the audited contract ─────────────
// Uses BigInt throughout — virtual reserves can exceed 10^27, far past what
// a JS Number can represent safely. Getting this wrong wouldn't just be a
// display bug, it would silently mis-calculate slippage protection.
function ceilDiv(a, b) { return (a + b - 1n) / b; }

function safeBigInt(value, fieldName) {
  try {
    return BigInt(value);
  } catch {
    throw new Error(`Malformed data for ${fieldName} — try refreshing the page.`);
  }
}

function calculateBuyOutput(virtualUsdcReserves, virtualTokenReserves, usdcIn, buyFeeBps) {
  const fee = (usdcIn * BigInt(buyFeeBps)) / BPS_DENOMINATOR;
  const usdcInAfterFee = usdcIn - fee;
  const k = virtualUsdcReserves * virtualTokenReserves;
  const newVirtualUsdc = virtualUsdcReserves + usdcInAfterFee;
  const newVirtualToken = ceilDiv(k, newVirtualUsdc);
  if (newVirtualToken > virtualTokenReserves) return 0n; // guard against malformed data
  return virtualTokenReserves - newVirtualToken;
}

function calculateSellOutput(virtualUsdcReserves, virtualTokenReserves, tokensIn, sellFeeBps) {
  const k = virtualUsdcReserves * virtualTokenReserves;
  const newVirtualToken = virtualTokenReserves + tokensIn;
  const newVirtualUsdc = ceilDiv(k, newVirtualToken);
  if (newVirtualUsdc > virtualUsdcReserves) return 0n; // guard against malformed data
  const usdcOutGross = virtualUsdcReserves - newVirtualUsdc;
  const fee = (usdcOutGross * BigInt(sellFeeBps)) / BPS_DENOMINATOR;
  return usdcOutGross - fee;
}

// ── Retry helper — same reasoning as create-token.html: this RPC endpoint
// has proven unreliable repeatedly this session (rate limits, batching
// issues), and MetaMask's own internal limiter needs longer than a couple
// seconds to clear.
async function withRetry(fn, { onRetry } = {}) {
  let attempt = 0;
  for (;;) {
    try {
      return await fn();
    } catch (err) {
      const isRateLimit = /rate limit|too many requests|request limit/i.test(
        err.message || err.shortMessage || err?.info?.error?.message || ""
      );
      const maxRetries = isRateLimit ? 6 : 3;
      const baseDelay = isRateLimit ? 2500 : 800;
      if (attempt >= maxRetries) throw err;
      const delay = baseDelay * 2 ** attempt;
      if (onRetry) onRetry(attempt + 1, maxRetries, delay, isRateLimit);
      await new Promise((r) => setTimeout(r, delay));
      attempt++;
    }
  }
}

// ── Wallet ───────────────────────────────────────────────────────────
let provider, signer, userAddress, factory, usdc;

async function ensureArcNetwork() {
  const currentChainId = await window.ethereum.request({ method: "eth_chainId" });
  if (currentChainId === CHAIN_ID_HEX) return;
  try {
    await window.ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId: CHAIN_ID_HEX }] });
  } catch (switchError) {
    if (switchError.code === 4902) {
      await window.ethereum.request({
        method: "wallet_addEthereumChain",
        params: [{
          chainId: CHAIN_ID_HEX,
          chainName: "Arc Testnet",
          nativeCurrency: { name: "USDC", symbol: "USDC", decimals: 18 },
          rpcUrls: [RPC_URL],
          blockExplorerUrls: [EXPLORER_URL],
        }],
      });
    } else {
      throw switchError;
    }
  }
}

async function connectWallet() {
  if (!window.ethereum) {
    $("walletPill").textContent = "No wallet found";
    return;
  }
  try {
    await window.ethereum.request({ method: "eth_requestAccounts" });
    await ensureArcNetwork();
    provider = new ethers.BrowserProvider(window.ethereum);
    signer = await provider.getSigner();
    userAddress = await signer.getAddress();
    factory = new ethers.Contract(FACTORY_ADDRESS, FACTORY_ABI, signer);
    usdc = new ethers.Contract(USDC_ADDRESS, ERC20_ABI, signer);
    $("walletPill").textContent = short(userAddress);
    $("walletPill").classList.add("on");
    $("connectBtn").textContent = "Connected";
    await refreshAllowancePill();
  } catch (err) {
    $("walletPill").textContent = "Connection failed";
  }
}
$("connectBtn").addEventListener("click", connectWallet);

async function refreshAllowancePill() {
  if (!usdc || !userAddress) return;
  try {
    const allowance = await withRetry(() => usdc.allowance(userAddress, FACTORY_ADDRESS));
    const pill = $("allowancePill");
    if (allowance === 0n) {
      pill.style.display = "none";
      return;
    }
    pill.style.display = "inline-flex";
    pill.style.alignItems = "center";
    pill.style.gap = "6px";
    pill.textContent = "";
    pill.appendChild(el("span", null, "Approved: $" + Number(ethers.formatUnits(allowance, 6)).toFixed(0)));
    const revoke = el("a", null, "Revoke");
    revoke.href = "#";
    revoke.style.color = "var(--brass)";
    revoke.style.textDecoration = "underline";
    revoke.addEventListener("click", async (e) => {
      e.preventDefault();
      pill.style.opacity = "0.5";
      try {
        const tx = await withRetry(() => usdc.approve(FACTORY_ADDRESS, 0n));
        await withRetry(() => tx.wait());
        await refreshAllowancePill();
      } catch { pill.style.opacity = "1"; }
    });
    pill.appendChild(document.createTextNode(" · "));
    pill.appendChild(revoke);
  } catch { /* non-critical display element, fail silently */ }
}

// ── Rendering ────────────────────────────────────────────────────────
let allTokens = [];
let searchQuery = "";

function renderColumn(listEl, countEl, tokens, kind) {
  listEl.innerHTML = "";
  countEl.textContent = tokens.length;

  if (tokens.length === 0) {
    listEl.appendChild(el("div", "empty-state",
      kind === "grad" ? "Nothing close to graduating yet." : "No tokens created yet."));
    return;
  }

  for (const t of tokens) {
    const row = el("div", "row");

    const avatar = el("div", "avatar", (t.symbol || "?").slice(0, 2).toUpperCase());
    avatar.style.background = avatarColor(t.contract_address);
    row.appendChild(avatar);

    const meta = el("div", "token-meta");
    const symLine = el("div", "token-symbol");
    symLine.appendChild(el("span", null, t.symbol || "???"));
    if (t.verification_status === "verified") symLine.appendChild(el("span", "badge", "✓"));
    meta.appendChild(symLine);
    meta.appendChild(el("div", "token-name", t.name || "Unnamed"));
    meta.appendChild(el("div", "row-sub", short(t.creator_address) + " · " + relativeAge(t.created_at)));
    row.appendChild(meta);

    const stats = el("div", "col-stats");
    const price = computePrice(t);
    stats.appendChild(el("div", "price", price !== null ? "$" + price.toFixed(8) : "—"));
    if (price !== null) {
      const mcap = price * 1_000_000_000; // price × fixed total supply
      stats.appendChild(el("div", "row-sub", "MC $" + formatCompact(mcap)));
    }
    if (typeof t.volume_1h_usdc === "number") {
      stats.appendChild(el("div", "row-sub", "Vol $" + formatCompact(t.volume_1h_usdc)));
    }
    if (kind === "grad") {
      const progressPct = computeProgress(t);
      const pWrap = el("div", "progress-wrap");
      const pTrack = el("div", "progress-track");
      const pFill = el("div", "progress-fill");
      pFill.style.width = Math.min(100, progressPct) + "%";
      pTrack.appendChild(pFill);
      pWrap.appendChild(pTrack);
      pWrap.appendChild(el("div", "progress-label", progressPct.toFixed(0) + "%"));
      stats.appendChild(pWrap);
    }
    row.appendChild(stats);

    const buyBtn = el("button", "buy-btn", "Buy");
    buyBtn.addEventListener("click", () => openDrawer(t));
    row.appendChild(buyBtn);

    listEl.appendChild(row);
  }
}

function computePrice(t) {
  try {
    const vUsdc = BigInt(t.virtual_usdc_reserves);
    const vToken = BigInt(t.virtual_token_reserves);
    if (vToken === 0n) return null;
    // price per whole token, in USDC: (vUsdc / 1e6) / (vToken / 1e18)
    const scaled = (vUsdc * 10n ** 18n * 10n ** 8n) / (vToken * 10n ** 6n);
    return Number(scaled) / 1e8;
  } catch { return null; }
}

function computeProgress(t) {
  try {
    const real = Number(BigInt(t.real_usdc_reserves));
    const threshold = Number(BigInt(t.graduation_threshold_usdc));
    if (threshold <= 0) return 0;
    return Math.max(0, Math.min(100, (real / threshold) * 100));
  } catch { return 0; }
}

function applyFilterAndRender() {
  const q = searchQuery.trim().toLowerCase();
  const filtered = q
    ? allTokens.filter((t) => (t.name || "").toLowerCase().includes(q) || (t.symbol || "").toLowerCase().includes(q))
    : allTokens;

  const notGraduated = filtered.filter((t) => !t.graduated);
  const newPairs = [...notGraduated].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  const graduating = notGraduated
    .filter((t) => computeProgress(t) >= 40)
    .sort((a, b) => computeProgress(b) - computeProgress(a));

  renderColumn($("newList"), $("newCount"), newPairs.slice(0, 40), "new");
  renderColumn($("gradList"), $("gradCount"), graduating.slice(0, 40), "grad");
}

$("searchInput").addEventListener("input", (e) => {
  searchQuery = e.target.value;
  applyFilterAndRender();
});

async function pollTokens() {
  try {
    const data = await fetchTokens("order=created_at.desc&limit=200");
    allTokens = data;
    applyFilterAndRender();
  } catch (err) {
    // Network hiccup: keep showing the last-known-good data rather than
    // clearing the feed or crashing. Next poll cycle tries again.
    console.warn("Poll failed, keeping stale data:", err.message);
  }
}

// ── Trade drawer ─────────────────────────────────────────────────────
let activeToken = null;
let activeSide = "buy"; // "buy" | "sell"
let tokenContract = null; // ERC20 instance for whichever token is active — different per token, set fresh each time the drawer opens
let selectedAmount = null; // USD amount for buy, raw token amount (as a string) for sell

function renderTrustBadges(token) {
  const wrap = $("trustBadges");
  wrap.innerHTML = "";
  const badge = (text, tone) => {
    const b = el("span", "badge" + (tone ? " " + tone : ""), text);
    wrap.appendChild(b);
  };
  // These are true for every token on this platform by contract design, not a
  // per-token heuristic guess — the factory has no mint function reachable after
  // deployment, and LP is sent to a burn address automatically at graduation.
  badge("No Mint ✓");
  badge(token.graduated ? "LP Burned ✓" : "Pre-graduation");
  if (token.buy_fee_bps != null) badge((token.buy_fee_bps / 100).toFixed(1) + "% fee");
}

function renderPresetButtons() {
  const grid = $("presetGrid");
  grid.innerHTML = "";
  const presets = activeSide === "buy"
    ? [{ label: "$10", value: 10 }, { label: "$50", value: 50 }, { label: "$100", value: 100 }, { label: "$500", value: 500 }]
    : [{ label: "25%", value: 25 }, { label: "50%", value: 50 }, { label: "75%", value: 75 }, { label: "100%", value: 100 }];
  for (const p of presets) {
    const btn = el("button", "preset-btn", p.label);
    btn.dataset.value = p.value;
    grid.appendChild(btn);
  }
  $("customAmount").placeholder = activeSide === "buy" ? "Custom USDC amount" : "Custom token amount";
  $("customAmount").value = "";
  $("payLabel").textContent = activeSide === "buy" ? "You pay" : "You sell";
  $("receiveLabel").textContent = activeSide === "buy" ? "Est. receive" : "Est. receive";
  $("balanceLabel").textContent = activeSide === "buy" ? "Your USDC balance" : `Your ${activeToken?.symbol || "token"} balance`;
}

async function switchSide(side) {
  activeSide = side;
  $("tabBuy").style.background = side === "buy" ? "var(--seal-dim)" : "var(--panel-raised)";
  $("tabBuy").style.color = side === "buy" ? "#EAFBF5" : "var(--ink-dim)";
  $("tabSell").style.background = side === "sell" ? "var(--seal-dim)" : "var(--panel-raised)";
  $("tabSell").style.color = side === "sell" ? "#EAFBF5" : "var(--ink-dim)";
  selectedAmount = null;
  $("drawerPay").textContent = "—";
  $("drawerReceive").textContent = "—";
  $("drawerMin").textContent = "—";
  $("drawerConfirm").disabled = true;
  $("drawerConfirm").textContent = "Select an amount";
  renderPresetButtons();
  await refreshDrawerBalance();
}
$("tabBuy").addEventListener("click", () => switchSide("buy"));
$("tabSell").addEventListener("click", () => switchSide("sell"));

async function refreshDrawerBalance() {
  $("drawerBalance").textContent = "—";
  if (!signer || !activeToken) return;
  try {
    if (activeSide === "buy") {
      const bal = await withRetry(() => usdc.balanceOf(userAddress));
      $("drawerBalance").textContent = Number(ethers.formatUnits(bal, 6)).toLocaleString(undefined, { maximumFractionDigits: 2 }) + " USDC";
    } else {
      const bal = await withRetry(() => tokenContract.balanceOf(userAddress));
      $("drawerBalance").textContent = Number(ethers.formatUnits(bal, 18)).toLocaleString(undefined, { maximumFractionDigits: 2 }) + " " + (activeToken.symbol || "");
    }
  } catch { /* non-critical display, fail silently */ }
}

function openDrawer(token) {
  activeToken = token;
  activeSide = "buy";
  selectedAmount = null;
  tokenContract = signer ? new ethers.Contract(token.contract_address, ERC20_ABI, signer) : null;

  $("drawerSymbol").textContent = token.symbol || "???";
  $("drawerPay").textContent = "—";
  $("drawerReceive").textContent = "—";
  $("drawerMin").textContent = "—";
  $("drawerBalance").textContent = "—";
  $("drawerConfirm").disabled = true;
  $("drawerConfirm").textContent = "Select an amount";
  $("drawerStatus").className = "drawer-status";
  $("drawerStatus").textContent = "";
  $("tabBuy").click(); // resets to buy tab + renders presets

  renderTrustBadges(token);
  renderPriceChart(token.contract_address);
  refreshDrawerBalance();
  $("drawerBackdrop").classList.add("open");
}

async function renderPriceChart(tokenAddress) {
  const svg = $("chartSvg");
  const emptyEl = $("chartEmpty");
  svg.innerHTML = "";
  emptyEl.style.display = "none";
  svg.style.display = "block";

  let trades;
  try {
    const url = `${SUPABASE_URL}/rest/v1/trades?select=usdc_amount,token_amount,created_at&token_address=eq.${tokenAddress}&order=created_at.asc&limit=100`;
    const res = await fetch(url, { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } });
    trades = res.ok ? await res.json() : [];
  } catch {
    trades = [];
  }

  // Price per trade, in USDC per whole token. Number() is fine here — this is purely
  // for plotting a chart, not for any trade-execution math, where BigInt precision
  // actually matters (see calculateBuyOutput).
  const points = trades
    .map((t) => {
      const usdcAmt = Number(t.usdc_amount) / 1e6;
      const tokenAmt = Number(t.token_amount) / 1e18;
      return tokenAmt > 0 ? usdcAmt / tokenAmt : null;
    })
    .filter((p) => p !== null && isFinite(p));

  if (points.length < 2) {
    svg.style.display = "none";
    emptyEl.style.display = "block";
    return;
  }

  const w = 336, h = 90, pad = 4;
  const min = Math.min(...points), max = Math.max(...points);
  const range = max - min || max || 1;
  const stepX = (w - pad * 2) / (points.length - 1);
  const coords = points.map((p, i) => {
    const x = pad + i * stepX;
    const y = h - pad - ((p - min) / range) * (h - pad * 2);
    return [x, y];
  });

  const isUp = points[points.length - 1] >= points[0];
  const lineColor = isUp ? "var(--up)" : "var(--down)";

  const polyline = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
  polyline.setAttribute("points", coords.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" "));
  polyline.setAttribute("fill", "none");
  polyline.setAttribute("stroke", lineColor);
  polyline.setAttribute("stroke-width", "1.6");
  polyline.setAttribute("stroke-linejoin", "round");
  polyline.setAttribute("stroke-linecap", "round");
  svg.appendChild(polyline);

  // Fill under the line for a bit of visual weight, matching the genre convention.
  const areaPoints = [`${pad},${h - pad}`, ...coords.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`), `${(pad + (points.length - 1) * stepX).toFixed(1)},${h - pad}`];
  const area = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
  area.setAttribute("points", areaPoints.join(" "));
  area.setAttribute("fill", lineColor);
  area.setAttribute("fill-opacity", "0.08");
  area.setAttribute("stroke", "none");
  svg.insertBefore(area, polyline);
}

function closeDrawer() {
  $("drawerBackdrop").classList.remove("open");
  activeToken = null;
}
$("drawerClose").addEventListener("click", closeDrawer);
$("drawerBackdrop").addEventListener("click", (e) => { if (e.target === $("drawerBackdrop")) closeDrawer(); });

function updateQuote() {
  if (!activeToken || selectedAmount === null || selectedAmount <= 0) {
    $("drawerConfirm").disabled = true;
    $("drawerConfirm").textContent = "Select an amount";
    return;
  }

  try {
    const vUsdc = safeBigInt(activeToken.virtual_usdc_reserves, "virtual USDC reserves");
    const vToken = safeBigInt(activeToken.virtual_token_reserves, "virtual token reserves");

    if (activeSide === "buy") {
      const usdcIn = ethers.parseUnits(selectedAmount.toString(), 6);
      const expectedOut = calculateBuyOutput(vUsdc, vToken, usdcIn, activeToken.buy_fee_bps);
      const minOut = (expectedOut * 98n) / 100n;
      $("drawerPay").textContent = selectedAmount + " USDC";
      $("drawerReceive").textContent = Number(ethers.formatUnits(expectedOut, 18)).toLocaleString(undefined, { maximumFractionDigits: 2 }) + " " + (activeToken.symbol || "");
      $("drawerMin").textContent = Number(ethers.formatUnits(minOut, 18)).toLocaleString(undefined, { maximumFractionDigits: 2 }) + " " + (activeToken.symbol || "");
    } else {
      const tokensIn = ethers.parseUnits(selectedAmount.toString(), 18);
      const expectedOut = calculateSellOutput(vUsdc, vToken, tokensIn, activeToken.sell_fee_bps);
      const minOut = (expectedOut * 98n) / 100n;
      $("drawerPay").textContent = selectedAmount.toLocaleString(undefined, { maximumFractionDigits: 4 }) + " " + (activeToken.symbol || "");
      $("drawerReceive").textContent = Number(ethers.formatUnits(expectedOut, 6)).toFixed(4) + " USDC";
      $("drawerMin").textContent = Number(ethers.formatUnits(minOut, 6)).toFixed(4) + " USDC";
    }
    $("drawerConfirm").disabled = false;
    $("drawerConfirm").textContent = signer ? (activeSide === "buy" ? "Buy" : "Sell") : "Connect wallet to continue";
  } catch (err) {
    $("drawerStatus").className = "drawer-status error";
    $("drawerStatus").textContent = err.message;
  }
}

$("presetGrid").addEventListener("click", async (e) => {
  const btn = e.target.closest(".preset-btn");
  if (!btn || !activeToken) return;
  document.querySelectorAll(".preset-btn").forEach((b) => b.classList.remove("active"));
  btn.classList.add("active");
  $("customAmount").value = "";

  if (activeSide === "buy") {
    selectedAmount = Number(btn.dataset.value);
  } else {
    // Percentage of the user's actual on-chain balance, fetched fresh so it's
    // never stale relative to a balance shown a while ago.
    if (!signer || !tokenContract) { await connectWallet(); }
    if (!tokenContract) return;
    try {
      const bal = await withRetry(() => tokenContract.balanceOf(userAddress));
      const pct = BigInt(btn.dataset.value);
      const amountWei = (bal * pct) / 100n;
      selectedAmount = Number(ethers.formatUnits(amountWei, 18));
    } catch {
      $("drawerStatus").className = "drawer-status error";
      $("drawerStatus").textContent = "Couldn't read your token balance.";
      return;
    }
  }
  updateQuote();
});

$("customAmount").addEventListener("input", (e) => {
  document.querySelectorAll(".preset-btn").forEach((b) => b.classList.remove("active"));
  const val = parseFloat(e.target.value);
  selectedAmount = isNaN(val) || val <= 0 ? null : val;
  updateQuote();
});

$("drawerConfirm").addEventListener("click", async () => {
  if (!activeToken || selectedAmount === null) return;
  if (!signer) { await connectWallet(); if (!signer) return; tokenContract = new ethers.Contract(activeToken.contract_address, ERC20_ABI, signer); }

  const statusEl = $("drawerStatus");
  const setDrawerStatus = (text, kind) => { statusEl.className = "drawer-status" + (kind ? " " + kind : ""); statusEl.innerHTML = text; };
  const onRetry = (attempt, max, delay, isRateLimit) => {
    setDrawerStatus(`<span class="spinner"></span> ${isRateLimit ? "Rate limited" : "Retrying"} — attempt ${attempt}/${max}, waiting ${(delay / 1000).toFixed(1)}s…`, "warn");
  };

  $("drawerConfirm").disabled = true;

  try {
    const vUsdc = safeBigInt(activeToken.virtual_usdc_reserves, "virtual USDC reserves");
    const vToken = safeBigInt(activeToken.virtual_token_reserves, "virtual token reserves");

    if (activeSide === "buy") {
      const usdcIn = ethers.parseUnits(selectedAmount.toString(), 6);
      const expectedOut = calculateBuyOutput(vUsdc, vToken, usdcIn, activeToken.buy_fee_bps);
      const minOut = (expectedOut * 98n) / 100n;

      const balance = await withRetry(() => usdc.balanceOf(userAddress), { onRetry });
      if (balance < usdcIn) {
        setDrawerStatus(`Not enough USDC. Have ${ethers.formatUnits(balance, 6)}. Get testnet USDC from <a href="https://faucet.circle.com" target="_blank">faucet.circle.com</a>.`, "error");
        $("drawerConfirm").disabled = false;
        return;
      }

      const allowance = await withRetry(() => usdc.allowance(userAddress, FACTORY_ADDRESS), { onRetry });
      if (allowance < usdcIn) {
        const budgetWei = ethers.parseUnits(APPROVAL_BUDGET_USDC.toString(), 6);
        const approveAmount = usdcIn > budgetWei ? usdcIn : budgetWei;
        setDrawerStatus(`<span class="spinner"></span> Approving USDC (covers this and future trades up to $${ethers.formatUnits(approveAmount, 6)}) — confirm in your wallet…`, "warn");
        const approveTx = await withRetry(() => usdc.approve(FACTORY_ADDRESS, approveAmount), { onRetry });
        setDrawerStatus('<span class="spinner"></span> Waiting for approval…', "warn");
        await withRetry(() => approveTx.wait(), { onRetry });
        refreshAllowancePill();
      }

      setDrawerStatus('<span class="spinner"></span> Confirm the buy in your wallet…', "warn");
      const tx = await withRetry(() => factory.buy(activeToken.contract_address, usdcIn, minOut), { onRetry });
      setDrawerStatus('<span class="spinner"></span> Waiting for confirmation…', "warn");
      await withRetry(() => tx.wait(), { onRetry });
      setDrawerStatus("✓ Bought. This may take a few seconds to reflect in the feed.", "ok");
    } else {
      const tokensIn = ethers.parseUnits(selectedAmount.toString(), 18);
      const expectedOut = calculateSellOutput(vUsdc, vToken, tokensIn, activeToken.sell_fee_bps);
      const minOut = (expectedOut * 98n) / 100n;

      const balance = await withRetry(() => tokenContract.balanceOf(userAddress), { onRetry });
      if (balance < tokensIn) {
        setDrawerStatus(`Not enough ${activeToken.symbol}. You have ${ethers.formatUnits(balance, 18)}.`, "error");
        $("drawerConfirm").disabled = false;
        return;
      }

      // Separate approval from the USDC one above — selling requires approving the
      // FACTORY to move the TOKEN out of your wallet, a completely different
      // allowance than the USDC approval buying uses.
      const allowance = await withRetry(() => tokenContract.allowance(userAddress, FACTORY_ADDRESS), { onRetry });
      if (allowance < tokensIn) {
        setDrawerStatus('<span class="spinner"></span> Approving token for sale — confirm in your wallet…', "warn");
        const approveTx = await withRetry(() => tokenContract.approve(FACTORY_ADDRESS, tokensIn), { onRetry });
        setDrawerStatus('<span class="spinner"></span> Waiting for approval…', "warn");
        await withRetry(() => approveTx.wait(), { onRetry });
      }

      setDrawerStatus('<span class="spinner"></span> Confirm the sell in your wallet…', "warn");
      const tx = await withRetry(() => factory.sell(activeToken.contract_address, tokensIn, minOut), { onRetry });
      setDrawerStatus('<span class="spinner"></span> Waiting for confirmation…', "warn");
      await withRetry(() => tx.wait(), { onRetry });
      setDrawerStatus("✓ Sold. This may take a few seconds to reflect in the feed.", "ok");
    }

    $("drawerConfirm").textContent = "Done";
    setTimeout(closeDrawer, 1800);
  } catch (err) {
    const msg = err.shortMessage || err.reason || err.message || "Unknown error";
    setDrawerStatus("Failed: " + msg, "error");
    $("drawerConfirm").disabled = false;
  }
});

if (window.ethereum) {
  window.ethereum.on("accountsChanged", () => window.location.reload());
  window.ethereum.on("chainChanged", () => window.location.reload());
}

pollTokens();
setInterval(pollTokens, POLL_INTERVAL_MS);
</script>
