    --border: #212B26;
    --ink: #E7EEEA;
    --ink-dim: #7C8C84;
    --ink-faint: #4E5D56;

    --seal-dim: #1F6F5C;
    --seal-glow: rgba(43,163,131,0.12);

    margin: 0 auto;

<script>

const FACTORY_ABI = [

const ERC20_ABI = [

// ══ EIP-5792 BATCHING — PROGRESSIVE ENHANCEMENT ══════════════════════════
// One click instead of two, where the wallet can do it, and the existing sequential path
// everywhere else. Nothing below is required for the app to work.
//
// The app never asks a wallet to sign an EIP-7702 authorisation. It asks EIP-5792 whether
// atomic batching is available and, if so, submits approve+buy as one call set. HOW the
// wallet delivers that -- a 7702 delegation, a 4337 smart account, something else -- is the
// wallet's business, not ours. That is why this is a small change rather than a second
// codebase: unsupported wallets fall through to exactly what they do today.
//
// Every failure path here falls back rather than surfacing an error. A wallet that half
// implements 5792 must not be able to break buying.

const BATCH_VERSION = "2.0.0";

async function chainIdHex() {
  try { return await window.ethereum.request({ method: "eth_chainId" }); }
  catch { return null; }
}

// Two capability shapes are in the wild: the current `atomic: { status }` and the earlier
// `atomicBatch: { supported }`. Accept either, treat anything else as unsupported.
async function supportsAtomicBatch(from) {
  if (!window.ethereum?.request) return false;
  const cid = await chainIdHex();
  if (!cid) return false;
  try {
    const caps = await window.ethereum.request({
      method: "wallet_getCapabilities",
      params: [from, [cid]],
    });
    const c = caps?.[cid] || caps?.[parseInt(cid, 16)] || {};
    const status = c.atomic?.status;
    if (status === "supported" || status === "ready") return true;
    if (c.atomicBatch?.supported === true) return true;
    return false;
  } catch {
    // Wallets that predate 5792 reject the method outright. That is a "no", not an error.
    return false;
  }
}

// Returns a batch id, or null to mean "fall back". Never throws.
async function sendCallsOrNull(from, calls) {
  const cid = await chainIdHex();
  if (!cid) return null;
  try {
    const res = await window.ethereum.request({
      method: "wallet_sendCalls",
      params: [{
        version: BATCH_VERSION,
        chainId: cid,
        from,
        // Atomic or nothing: a partial batch that approved but did not buy would leave a
        // standing allowance the user did not knowingly grant.
        atomicRequired: true,
        calls,
      }],
    });
    return typeof res === "string" ? res : (res?.id ?? null);
  } catch {
    return null;
  }
}

// Poll until the batch settles. Status 100 = pending, 200 = confirmed; anything else is a
// failure. Returns true only on a confirmed success.
async function waitForCalls(id, { timeoutMs = 120000, intervalMs = 1500 } = {}) {
  const deadline = Date.now() + timeoutMs;
  while (Date.now() < deadline) {
    try {
      const st = await window.ethereum.request({ method: "wallet_getCallsStatus", params: [id] });
      const code = typeof st?.status === "number" ? st.status : null;
      if (code === 200) return true;
      if (code !== null && code !== 100) return false;
      // Older wallets report a string status instead of a numeric code.
      if (st?.status === "CONFIRMED") return true;
      if (st?.status && st.status !== "PENDING") return false;
    } catch { return false; }
    await new Promise((r) => setTimeout(r, intervalMs));
  }
  return false;
}

// ══ GAS, FEES AND THE ONE-BALANCE PROBLEM ════════════════════════════════
// FRONTEND_BUILD_V2 rules 3, 4 and 6. On Arc, gas IS the settlement asset: the 18-decimal
// native balance and the 6-decimal ERC-20 view are the SAME money. So every spend competes
// with the gas needed to make it, and a user who spends everything is stranded holding a
// token they cannot sell. Measured on testnet: a wallet left with 0.0016 USDC held 471
// trillion tokens and could not move them.

const GWEI = 1000000000n;
const MIN_MAX_FEE = 20n * GWEI;   // rule 6: Arc's documented floor. Below it a transaction
                                  // "may remain pending indefinitely or fail outright".
const TIP = 1n * GWEI;            // 0 is accepted; a small tip improves inclusion under load
const SCALE_18_TO_6 = 1000000000000n;
const GAS_LIMIT_TRADE = 600000n;  // Arc's eth_estimateGas returns NO margin, so budget high
const RESERVE_MULTIPLE = 3n;      // headroom: approve + trade + one retry

// Read the fee from the chain EVERY time. The base-fee ceiling is 20,000 Gwei -- a
// thousand times the floor -- so a reserve sized from the floor, or from a quiet-period
// sample, is wrong by up to 1000x exactly when the network is busy.
async function currentFees() {
  let base = MIN_MAX_FEE;
  try {
    const fd = await readProvider.getFeeData();
    const seen = fd.maxFeePerGas ?? fd.gasPrice ?? 0n;
    if (seen > base) base = seen;
  } catch { /* fall back to the floor rather than blocking the trade */ }
  return { maxFeePerGas: base, maxPriorityFeePerGas: TIP };
}

// One transaction's worth of gas, in 6dp USDC, rounded up.
async function txCostUsdc6(gasLimit = GAS_LIMIT_TRADE) {
  const { maxFeePerGas } = await currentFees();
  const wei = gasLimit * maxFeePerGas;
  return (wei + SCALE_18_TO_6 - 1n) / SCALE_18_TO_6;
}

// What the user may actually spend: balance minus a reserve that covers the trade, the
// approve that may precede it, and a retry. Never offer "max" without this.
async function availableToTrade(balance6) {
  const reserve = (await txCostUsdc6()) * RESERVE_MULTIPLE;
  return { available: balance6 > reserve ? balance6 - reserve : 0n, reserve };
}

// Rule 4: decide by ARITHMETIC, never by parsing a revert string. Arc's docs say the
// strings are not a stable contract and Zero8 changes them on 3 September -- a client that
// parses them does not throw when they change, it silently stops warning.
async function affordabilityProblem(balance6, spend6) {
  const { available, reserve } = await availableToTrade(balance6);
  if (balance6 === 0n) {
    return "This wallet has no USDC. On Arc, USDC is also the gas token, so you need some "
         + "before any transaction — including an approval. "
         + '<a href="https://faucet.circle.com" target="_blank">faucet.circle.com</a>';
  }
  if (spend6 > available) {
    const fmt = (v) => Number(ethers.formatUnits(v, 6)).toFixed(4);
    return `Not enough USDC once gas is reserved. Balance ${fmt(balance6)}, `
         + `gas reserve ${fmt(reserve)}, available to trade ${fmt(available)}. `
         + "Gas is paid in USDC on Arc, so spending your whole balance would leave you "
         + "unable to sell.";
  }
  return null;
}

// Rule 7. A blocklisted wallet cannot send OR receive USDC, and USDC is the gas token, so
// every path fails and none of them explains why. Say it plainly instead.
async function blocklistProblem(address) {
  try {
    const readUsdc = new ethers.Contract(USDC_ADDRESS, ERC20_ABI, readProvider);
    if (await readUsdc.isBlacklisted(address)) {
      return "This wallet is blocked by USDC's issuer and cannot send or receive USDC. "
           + "On Arc that also means it cannot pay gas, so no transaction will succeed. "
           + "This is set by Circle, not by us.";
    }
  } catch { /* view missing or RPC down: do not block the user on a check we cannot make */ }
  return null;
}

// ── Safe rendering helpers ──────────────────────────────────────────────
// Token name/symbol/description are supplied by WHOEVER created the token —
// any visitor to this page, not just the current user. Never insert them via
// innerHTML; always via textContent, so a hostile creator can't embed a
// script/HTML payload that runs in every other visitor's browser.
function el(tag, className, textContent) {
  const e = document.createElement(tag);
  if (className) e.className = className;
  if (textContent !== undefined) e.textContent = textContent;
  return e;
}

function short(addr) { return addr.slice(0, 6) + "…" + addr.slice(-4); }

function formatCompact(n) {
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + "M";
  if (n >= 1_000) return (n / 1_000).toFixed(1) + "K";
  return n.toFixed(0);
}

function relativeAge(isoString) {
  const secs = Math.floor((Date.now() - new Date(isoString).getTime()) / 1000);
  if (secs < 60) return secs + "s";
  if (secs < 3600) return Math.floor(secs / 60) + "m";
  if (secs < 86400) return Math.floor(secs / 3600) + "h";
  return Math.floor(secs / 86400) + "d";
}

function avatarColor(address) {
  // Deterministic color from the address, no external image dependency.
  let hash = 0;
  for (let i = 0; i < address.length; i++) hash = (hash * 31 + address.charCodeAt(i)) | 0;
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue}, 55%, 62%)`;
}

// ── Supabase REST fetch (read-only, anon key, RLS-protected) ───────────
async function fetchTokens(filterQuery) {
  const url = `${SUPABASE_URL}/rest/v1/tokens_with_volume?select=*&${filterQuery}`;
  const res = await fetch(url, {
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
    },
  });
  if (!res.ok) throw new Error(`Supabase fetch failed: ${res.status}`);
  return res.json();
}

// ── Curve math, mirrored exactly from the audited contract ─────────────
// Uses BigInt throughout — virtual reserves can exceed 10^27, far past what
// a JS Number can represent safely. Getting this wrong wouldn't just be a
// display bug, it would silently mis-calculate slippage protection.
function safeBigInt(value, fieldName) {
  try {
    return BigInt(value);
  } catch {
    throw new Error(`Malformed data for ${fieldName} — try refreshing the page.`);
  }
}

// The JS curve math that used to live here is GONE, deliberately.
//
// calculateBuyOutput / calculateSellOutput / ceilDiv re-derived _quoteBuy and _quoteSell
// in JavaScript. CLAUDE.md 1.3 forbids exactly that, and this is why: the buy function
// took only buyFeeBps and had NO snipe-tax parameter, while the contract charges
// c.buyFeeBps + taxBps. Measured against the live deployment (scripts/verify-frontend-
// pricing.js): at t=0 it OVERSTATES tokens received by 98.96x, still 11x at t=1 and 5.2x
// at t=2, converging only around t=5. Overstating is the dangerous direction -- minOut is
// derived from it, so the floor would sit ~97x above anything achievable and EVERY buy in
// the first seconds would revert. It also ignored the partial-fill clamp, and ran
// against reserves from the indexer feed rather than the chain, so it could be stale even
// when the arithmetic was right.
//
// quoteBuy/quoteSell are view functions ON the contract. They apply the live snipe tax,
// the clamp and the current reserves, and cannot drift from the contract because they are
// the contract.
//
// Shapes, which matter:
//   quoteBuy  -> { tokensOut, newVirtualUsdc, newVirtualToken, actualUsdcIn, actualFee }
//   quoteSell -> { actualTokensIn, newVirtualUsdc, newVirtualToken, usdcOutGross, fee }
// The seller receives usdcOutGross MINUS fee, and sell() compares minUsdcOut against that
// NET figure. Quoting gross would overstate the payout and is test-shape error 5 in
// CLAUDE.md 5 -- "asserting against gross payout where the contract compares net".
async function quoteBuyOnChain(tokenAddress, usdcIn) {
  const q = await readFactory.quoteBuy(tokenAddress, usdcIn);
  return { out: q.tokensOut, actualIn: q.actualUsdcIn, fee: q.actualFee };
}

async function quoteSellOnChain(tokenAddress, tokensIn) {
  const q = await readFactory.quoteSell(tokenAddress, tokensIn);
  return { out: q.usdcOutGross - q.fee, actualIn: q.actualTokensIn, fee: q.fee };
}

// Price impact as a HEADLINE number, not a footnote. The curve is thin -- a $500 buy at
// launch takes ~21% of supply with ~19% slippage -- and a user who receives 19% less than
// a quoted rate assumes they were robbed.
//
// NOT computed from currentPrice(). That returns virtualUsdcReserves*1e18/virtualToken-
// Reserves, which at launch scale evaluates to the integer 2 -- so any impact derived from
// it rounds to 0.00% and the headline number silently lies. Measured, not guessed.
//
// Instead: compare the rate this trade actually gets against the rate a negligible trade
// would get, both from quoteBuy, in tokens-per-USDC where the magnitudes are large enough
// to keep precision.
const IMPACT_PROBE = 10000n; // 0.01 USDC -- small enough to read as the marginal rate

async function buyImpactPct(tokenAddress, quoted) {
  try {
    if (quoted.out === 0n || quoted.actualIn === 0n) return null;
    const probe = await readFactory.quoteBuy(tokenAddress, IMPACT_PROBE);
    if (probe.tokensOut === 0n || probe.actualUsdcIn === 0n) return null;
    // Rates scaled by 1e6 so integer division keeps resolution.
    const marginal = (probe.tokensOut * 1000000n) / probe.actualUsdcIn;
    const effective = (quoted.out * 1000000n) / quoted.actualIn;
    if (marginal === 0n || effective >= marginal) return 0;
    return Number(((marginal - effective) * 10000n) / marginal) / 100;
  } catch { return null; }
}

// ── Retry helper — same reasoning as create-token.html: this RPC endpoint
// has proven unreliable repeatedly this session (rate limits, batching
// issues), and MetaMask's own internal limiter needs longer than a couple
// seconds to clear.
async function withRetry(fn, { onRetry } = {}) {
  let attempt = 0;
  for (;;) {
    try {
      return await fn();
    } catch (err) {
      // -32011 first: a numeric JSON-RPC code is stable, the wording is not. The regex is
      // kept as a fallback because rate-limit codes are not standardised across providers,
      // but it must never be the ONLY signal.
      const isRateLimit =
        err.code === -32011 ||
        err?.info?.error?.code === -32011 ||
        /rate limit|too many requests|request limit/i.test(
          err.message || err.shortMessage || err?.info?.error?.message || ""
        );
      const maxRetries = isRateLimit ? 6 : 3;
      const baseDelay = isRateLimit ? 2500 : 800;
      if (attempt >= maxRetries) throw err;
      const delay = baseDelay * 2 ** attempt;
      if (onRetry) onRetry(attempt + 1, maxRetries, delay, isRateLimit);
      await new Promise((r) => setTimeout(r, delay));
      attempt++;
    }
  }
}

let provider, signer, userAddress, factory, usdc;

async function ensureArcNetwork() {
  const currentChainId = await window.ethereum.request({ method: "eth_chainId" });
  if (currentChainId === CHAIN_ID_HEX) return;
  try {
    await window.ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId: CHAIN_ID_HEX }] });
  } catch (switchError) {
    if (switchError.code === 4902) {
      await window.ethereum.request({
        method: "wallet_addEthereumChain",
        params: [{
          chainId: CHAIN_ID_HEX,
          chainName: "Arc Testnet",
          nativeCurrency: { name: "USDC", symbol: "USDC", decimals: 18 },
          rpcUrls: [RPC_URL],
          blockExplorerUrls: [EXPLORER_URL],
        }],
      });
    } else {
      throw switchError;
    }
  }
}

async function connectWallet() {
  if (!window.ethereum) {
    $("walletPill").textContent = "No wallet found";
    return;
  }
  try {
    await window.ethereum.request({ method: "eth_requestAccounts" });
    await ensureArcNetwork();
    provider = new ethers.BrowserProvider(window.ethereum);
    signer = await provider.getSigner();
    userAddress = await signer.getAddress();
    factory = new ethers.Contract(FACTORY_ADDRESS, FACTORY_ABI, signer);
    usdc = new ethers.Contract(USDC_ADDRESS, ERC20_ABI, signer);
    $("walletPill").textContent = short(userAddress);
    $("walletPill").classList.add("on");
    $("connectBtn").textContent = "Connected";
    await refreshAllowancePill();
  } catch (err) {
    $("walletPill").textContent = "Connection failed";
  }
}
$("connectBtn").addEventListener("click", connectWallet);

async function refreshAllowancePill() {
  if (!usdc || !userAddress) return;
  try {
    const allowance = await withRetry(() => usdc.allowance(userAddress, FACTORY_ADDRESS));
    const pill = $("allowancePill");
    if (allowance === 0n) {
      pill.style.display = "none";
      return;
    }
    pill.style.display = "inline-flex";
    pill.style.alignItems = "center";
    pill.style.gap = "6px";
    pill.textContent = "";
    pill.appendChild(el("span", null, "Approved: $" + Number(ethers.formatUnits(allowance, 6)).toFixed(0)));
    const revoke = el("a", null, "Revoke");
    revoke.href = "#";
    revoke.style.color = "var(--brass)";
    revoke.style.textDecoration = "underline";
    revoke.addEventListener("click", async (e) => {
      e.preventDefault();
      pill.style.opacity = "0.5";
      try {
        const tx = await withRetry(() => usdc.approve(FACTORY_ADDRESS, 0n));
        await withRetry(() => tx.wait());
        await refreshAllowancePill();
      } catch { pill.style.opacity = "1"; }
    });
    pill.appendChild(document.createTextNode(" · "));
    pill.appendChild(revoke);
  } catch { /* non-critical display element, fail silently */ }
}

let allTokens = [];
let searchQuery = "";

function renderColumn(listEl, countEl, tokens, kind) {
  listEl.innerHTML = "";
  countEl.textContent = tokens.length;

  if (tokens.length === 0) {
    listEl.appendChild(el("div", "empty-state",
      kind === "grad" ? "Nothing close to graduating yet." : "No tokens created yet."));
    return;
  }

  for (const t of tokens) {
    const row = el("div", "row");

    const avatar = el("div", "avatar", (t.symbol || "?").slice(0, 2).toUpperCase());
    avatar.style.background = avatarColor(t.contract_address);
    row.appendChild(avatar);

    const meta = el("div", "token-meta");
    const symLine = el("div", "token-symbol");
    symLine.appendChild(el("span", null, t.symbol || "???"));
    if (t.verification_status === "verified") symLine.appendChild(el("span", "badge", "✓"));
    meta.appendChild(symLine);
    meta.appendChild(el("div", "token-name", t.name || "Unnamed"));
    meta.appendChild(el("div", "row-sub", short(t.creator_address) + " · " + relativeAge(t.created_at)));
    row.appendChild(meta);

    const stats = el("div", "col-stats");
    const price = computePrice(t);
    stats.appendChild(el("div", "price", price !== null ? "$" + price.toFixed(8) : "—"));
    if (price !== null) {
      const mcap = price * 1_000_000_000; // price × fixed total supply
      stats.appendChild(el("div", "row-sub", "MC $" + formatCompact(mcap)));
    }
    if (typeof t.volume_1h_usdc === "number") {
      stats.appendChild(el("div", "row-sub", "Vol $" + formatCompact(t.volume_1h_usdc)));
    }
    if (kind === "grad") {
      const progressPct = computeProgress(t);
      const pWrap = el("div", "progress-wrap");
      const pTrack = el("div", "progress-track");
      const pFill = el("div", "progress-fill");
      pFill.style.width = Math.min(100, progressPct) + "%";
      pTrack.appendChild(pFill);
      pWrap.appendChild(pTrack);
      pWrap.appendChild(el("div", "progress-label", progressPct.toFixed(0) + "%"));
      stats.appendChild(pWrap);
    }
    row.appendChild(stats);

    const buyBtn = el("button", "buy-btn", "Buy");
    buyBtn.addEventListener("click", () => openDrawer(t));
    row.appendChild(buyBtn);

    listEl.appendChild(row);
  }
}

function computePrice(t) {
  try {
    const vUsdc = BigInt(t.virtual_usdc_reserves);
    const vToken = BigInt(t.virtual_token_reserves);
    if (vToken === 0n) return null;
    // price per whole token, in USDC: (vUsdc / 1e6) / (vToken / 1e18)
    const scaled = (vUsdc * 10n ** 18n * 10n ** 8n) / (vToken * 10n ** 6n);
    return Number(scaled) / 1e8;
  } catch { return null; }
}

function computeProgress(t) {
  try {
    const real = Number(BigInt(t.real_usdc_reserves));
    const threshold = Number(BigInt(t.graduation_threshold_usdc));
    if (threshold <= 0) return 0;
    return Math.max(0, Math.min(100, (real / threshold) * 100));
  } catch { return 0; }
}

function applyFilterAndRender() {
  const q = searchQuery.trim().toLowerCase();
  const filtered = q
    ? allTokens.filter((t) => (t.name || "").toLowerCase().includes(q) || (t.symbol || "").toLowerCase().includes(q))
    : allTokens;

  const notGraduated = filtered.filter((t) => !t.graduated);
  const newPairs = [...notGraduated].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  const graduating = notGraduated
    .filter((t) => computeProgress(t) >= 40)
    .sort((a, b) => computeProgress(b) - computeProgress(a));

  renderColumn($("newList"), $("newCount"), newPairs.slice(0, 40), "new");
  renderColumn($("gradList"), $("gradCount"), graduating.slice(0, 40), "grad");
}

$("searchInput").addEventListener("input", (e) => {
  searchQuery = e.target.value;
  applyFilterAndRender();
});

async function pollTokens() {
  try {
    const data = await fetchTokens("order=created_at.desc&limit=200");
    allTokens = data;
    applyFilterAndRender();
  } catch (err) {
    // Network hiccup: keep showing the last-known-good data rather than
    // clearing the feed or crashing. Next poll cycle tries again.
    console.warn("Poll failed, keeping stale data:", err.message);
  }
}

async function renderPriceChart(tokenAddress) {
  const svg = $("chartSvg");
  const emptyEl = $("chartEmpty");
  svg.innerHTML = "";
  emptyEl.style.display = "none";
  svg.style.display = "block";

  let trades;
  try {
    const url = `${SUPABASE_URL}/rest/v1/trades?select=usdc_amount,token_amount,created_at&token_address=eq.${tokenAddress}&order=created_at.asc&limit=100`;
    const res = await fetch(url, { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } });
    trades = res.ok ? await res.json() : [];
  } catch {
    trades = [];
  }

  // Price per trade, in USDC per whole token. Number() is fine here — this is purely
  // for plotting a chart, not for any trade-execution math, where BigInt precision
  // actually matters (see quoteBuyOnChain).
  const points = trades
    .map((t) => {
      const usdcAmt = Number(t.usdc_amount) / 1e6;
      const tokenAmt = Number(t.token_amount) / 1e18;
      return tokenAmt > 0 ? usdcAmt / tokenAmt : null;
    })
    .filter((p) => p !== null && isFinite(p));

  if (points.length < 2) {
    svg.style.display = "none";
    emptyEl.style.display = "block";
    return;
  }

  const w = 336, h = 90, pad = 4;
  const min = Math.min(...points), max = Math.max(...points);
  const range = max - min || max || 1;
  const stepX = (w - pad * 2) / (points.length - 1);
  const coords = points.map((p, i) => {
    const x = pad + i * stepX;
    const y = h - pad - ((p - min) / range) * (h - pad * 2);
    return [x, y];
  });

  const isUp = points[points.length - 1] >= points[0];
  const lineColor = isUp ? "var(--up)" : "var(--down)";

  const polyline = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
  polyline.setAttribute("points", coords.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" "));
  polyline.setAttribute("fill", "none");
  polyline.setAttribute("stroke", lineColor);
  polyline.setAttribute("stroke-width", "1.6");
  polyline.setAttribute("stroke-linejoin", "round");
  polyline.setAttribute("stroke-linecap", "round");
  svg.appendChild(polyline);

  // Fill under the line for a bit of visual weight, matching the genre convention.
  const areaPoints = [`${pad},${h - pad}`, ...coords.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`), `${(pad + (points.length - 1) * stepX).toFixed(1)},${h - pad}`];
  const area = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
  area.setAttribute("points", areaPoints.join(" "));
  area.setAttribute("fill", lineColor);
  area.setAttribute("fill-opacity", "0.08");
  area.setAttribute("stroke", "none");
  svg.insertBefore(area, polyline);
}

function closeDrawer() {

$("drawerClose").addEventListener("click", closeDrawer);

// Slippage floor. NEVER zero -- CLAUDE.md 8: on an exhausted curve a zero default
// silently does nothing, and on a thin curve it means arbitrary sandwiching.
const SLIPPAGE_BPS = 200n; // 2%
function applySlippage(out) { return (out * (10000n - SLIPPAGE_BPS)) / 10000n; }

// Quotes are now an async round trip to the chain, so a slow response for an old amount
// can land after a newer one. Every call takes a ticket and only the newest writes to the
// DOM -- otherwise a user who clicks 10 then 100 can be shown the quote for 10.
let quoteTicket = 0;

async function updateQuote() {
  if (!activeToken || selectedAmount === null || selectedAmount <= 0) {
    $("drawerConfirm").disabled = true;
    $("drawerConfirm").textContent = "Select an amount";
    return;
  }

  const ticket = ++quoteTicket;
  const tokenAtRequest = activeToken.contract_address;
  const sideAtRequest = activeSide;
  $("drawerConfirm").disabled = true;
  $("drawerReceive").textContent = "…";
  $("drawerMin").textContent = "…";

  try {
    const isBuy = sideAtRequest === "buy";
    const amountIn = isBuy
      ? ethers.parseUnits(selectedAmount.toString(), 6)
      : ethers.parseUnits(selectedAmount.toString(), 18);

    const q = isBuy
      ? await quoteBuyOnChain(tokenAtRequest, amountIn)
      : await quoteSellOnChain(tokenAtRequest, amountIn);
    const impact = isBuy ? await buyImpactPct(tokenAtRequest, q) : null;

    // A stale response for a superseded amount must not overwrite the current one.
    if (ticket !== quoteTicket) return;

    const minOut = applySlippage(q.out);
    const sym = activeToken.symbol || "";

    if (isBuy) {
      // actualUsdcIn, not the requested amount: the clamp may fill less than offered near
      // graduation, and showing the offer would promise a spend the contract will not make.
      $("drawerPay").textContent = Number(ethers.formatUnits(q.actualIn, 6)).toFixed(4) + " USDC"
        + (q.actualIn < amountIn ? " (clamped — curve nearly full)" : "");
      $("drawerReceive").textContent =
        Number(ethers.formatUnits(q.out, 18)).toLocaleString(undefined, { maximumFractionDigits: 2 }) + " " + sym;
      $("drawerMin").textContent =
        Number(ethers.formatUnits(minOut, 18)).toLocaleString(undefined, { maximumFractionDigits: 2 }) + " " + sym
        + (impact === null ? "" : `  ·  price impact ${impact.toFixed(2)}%`);
    } else {
      $("drawerPay").textContent =
        Number(ethers.formatUnits(q.actualIn, 18)).toLocaleString(undefined, { maximumFractionDigits: 4 }) + " " + sym
        + (q.actualIn < amountIn ? " (clamped)" : "");
      $("drawerReceive").textContent = Number(ethers.formatUnits(q.out, 6)).toFixed(4) + " USDC";
      $("drawerMin").textContent = Number(ethers.formatUnits(minOut, 6)).toFixed(4) + " USDC";
    }

    $("drawerConfirm").disabled = false;
    $("drawerConfirm").textContent = signer ? (isBuy ? "Buy" : "Sell") : "Connect wallet to continue";
  } catch (err) {
    if (ticket !== quoteTicket) return;
    $("drawerStatus").className = "drawer-status error";
    // Decode the selector: a failed quote is usually a contract revert (UnknownToken,
    // CurveNotActive) and ethers hands those back undecoded on Arc.
    $("drawerStatus").textContent =
      "Could not price this trade: " + explainRevert(err, "no reason returned").message;
    $("drawerConfirm").disabled = true;
  }
}

$("presetGrid").addEventListener("click", async (e) => {
  const btn = e.target.closest(".preset-btn");
  if (!btn || !activeToken) return;
  document.querySelectorAll(".preset-btn").forEach((b) => b.classList.remove("active"));
  btn.classList.add("active");
  $("customAmount").value = "";

  if (activeSide === "buy") {
    selectedAmount = Number(btn.dataset.value);
  } else {
    // Percentage of the user's actual on-chain balance, fetched fresh so it's
    // never stale relative to a balance shown a while ago.
    if (!signer || !tokenContract) { await connectWallet(); }
    if (!tokenContract) return;
    try {
      const bal = await withRetry(() => tokenContract.balanceOf(userAddress));
      const pct = BigInt(btn.dataset.value);
      const amountWei = (bal * pct) / 100n;
      selectedAmount = Number(ethers.formatUnits(amountWei, 18));
    } catch {
      $("drawerStatus").className = "drawer-status error";
      $("drawerStatus").textContent = "Couldn't read your token balance.";
      return;
    }
  }
  updateQuote();
});

$("customAmount").addEventListener("input", (e) => {
  document.querySelectorAll(".preset-btn").forEach((b) => b.classList.remove("active"));
  const val = parseFloat(e.target.value);
  selectedAmount = isNaN(val) || val <= 0 ? null : val;
  updateQuote();
});

$("drawerConfirm").addEventListener("click", async () => {
  if (!activeToken || selectedAmount === null) return;
  if (!signer) { await connectWallet(); if (!signer) return; tokenContract = new ethers.Contract(activeToken.contract_address, ERC20_ABI, signer); }

  const statusEl = $("drawerStatus");
  const setDrawerStatus = (text, kind) => { statusEl.className = "drawer-status" + (kind ? " " + kind : ""); statusEl.innerHTML = text; };
  const onRetry = (attempt, max, delay, isRateLimit) => {
    setDrawerStatus(`<span class="spinner"></span> ${isRateLimit ? "Rate limited" : "Retrying"} — attempt ${attempt}/${max}, waiting ${(delay / 1000).toFixed(1)}s…`, "warn");
  };

  $("drawerConfirm").disabled = true;

  try {
    // Re-quote from the CHAIN at submit time. A quote taken during the snipe window is
    // stale within one second -- CLAUDE.md 8 measured an 8.7x swing as the tax decays --
    // so the number used for minOut must be fetched now, not carried from the panel.
    if (activeSide === "buy") {
      const usdcIn = ethers.parseUnits(selectedAmount.toString(), 6);
      const q = await withRetry(() => quoteBuyOnChain(activeToken.contract_address, usdcIn), { onRetry });
      const expectedOut = q.out;
      const minOut = applySlippage(expectedOut);
      if (minOut === 0n) {
        setDrawerStatus("This trade prices to zero — the curve may be full or the amount too small.", "error");
        $("drawerConfirm").disabled = false;
        return;
      }

      // Rule 7 first: a blocklisted wallet fails everything, including the approval.
      const blocked = await blocklistProblem(userAddress);
      if (blocked) { setDrawerStatus(blocked, "error"); $("drawerConfirm").disabled = false; return; }

      // Rules 3 + 4: arithmetic, before submitting. Gas comes out of this same balance.
      const balance = await withRetry(() => usdc.balanceOf(userAddress), { onRetry });
      const problem = await affordabilityProblem(balance, usdcIn);
      if (problem) { setDrawerStatus(problem, "error"); $("drawerConfirm").disabled = false; return; }

      const allowance = await withRetry(() => usdc.allowance(userAddress, FACTORY_ADDRESS), { onRetry });

      // One click, where the wallet supports it. Only worth attempting when an approval
      // would otherwise be needed -- with allowance already in place the buy is a single
      // transaction anyway and batching would add a round trip for nothing.
      if (allowance < usdcIn && await supportsAtomicBatch(userAddress)) {
        const budgetWei = ethers.parseUnits(APPROVAL_BUDGET_USDC.toString(), 6);
        const approveAmount = usdcIn > budgetWei ? usdcIn : budgetWei;
        const calls = [
          { to: USDC_ADDRESS, data: usdc.interface.encodeFunctionData("approve", [FACTORY_ADDRESS, approveAmount]), value: "0x0" },
          { to: FACTORY_ADDRESS, data: factory.interface.encodeFunctionData("buy", [activeToken.contract_address, usdcIn, minOut]), value: "0x0" },
        ];
        setDrawerStatus('<span class="spinner"></span> Approve and buy in one confirmation…', "warn");
        const id = await sendCallsOrNull(userAddress, calls);
        if (id && await waitForCalls(id)) {
          refreshAllowancePill();
          setDrawerStatus("✓ Bought in a single confirmation. This may take a few seconds to reflect in the feed.", "ok");
          $("drawerConfirm").disabled = false;
          return;
        }
        // Anything short of a confirmed success: say nothing about batching and do it the
        // ordinary way. The user should not be told about a capability that just failed.
        setDrawerStatus('<span class="spinner"></span> Continuing with separate steps…', "warn");
      }

      if (allowance < usdcIn) {
        const budgetWei = ethers.parseUnits(APPROVAL_BUDGET_USDC.toString(), 6);
        const approveAmount = usdcIn > budgetWei ? usdcIn : budgetWei;
        setDrawerStatus(`<span class="spinner"></span> Approving USDC (covers this and future trades up to $${ethers.formatUnits(approveAmount, 6)}) — confirm in your wallet…`, "warn");
        const approveTx = await withRetry(async () => usdc.approve(FACTORY_ADDRESS, approveAmount, await currentFees()), { onRetry });
        setDrawerStatus('<span class="spinner"></span> Waiting for approval…', "warn");
        await withRetry(() => approveTx.wait(), { onRetry });
        refreshAllowancePill();
      }

      setDrawerStatus('<span class="spinner"></span> Confirm the buy in your wallet…', "warn");
      const tx = await withRetry(async () => factory.buy(activeToken.contract_address, usdcIn, minOut, await currentFees()), { onRetry });
      setDrawerStatus('<span class="spinner"></span> Waiting for confirmation…', "warn");
      await withRetry(() => tx.wait(), { onRetry });
      setDrawerStatus("✓ Bought. This may take a few seconds to reflect in the feed.", "ok");
    } else {
      const tokensIn = ethers.parseUnits(selectedAmount.toString(), 18);
      // usdcOutGross MINUS fee. sell() compares minUsdcOut against the NET payout, so
      // quoting gross here would set an unreachable floor and revert every sell.
      const q = await withRetry(() => quoteSellOnChain(activeToken.contract_address, tokensIn), { onRetry });
      const expectedOut = q.out;
      const minOut = applySlippage(expectedOut);
      if (minOut === 0n) {
        setDrawerStatus("This trade prices to zero — try a larger amount.", "error");
        $("drawerConfirm").disabled = false;
        return;
      }

      const blockedSell = await blocklistProblem(userAddress);
      if (blockedSell) { setDrawerStatus(blockedSell, "error"); $("drawerConfirm").disabled = false; return; }

      const balance = await withRetry(() => tokenContract.balanceOf(userAddress), { onRetry });
      if (balance < tokensIn) {
        setDrawerStatus(`Not enough ${activeToken.symbol}. You have ${ethers.formatUnits(balance, 18)}.`, "error");
        $("drawerConfirm").disabled = false;
        return;
      }

      // The exit needs gas, and it is paid in USDC. This is the stranding case: holding
      // tokens with too little USDC to sell them. Checked by arithmetic, before submitting.
      const usdcForGas = await withRetry(() => usdc.balanceOf(userAddress), { onRetry });
      const needForSell = (await txCostUsdc6()) * 2n; // approve + sell
      if (usdcForGas < needForSell) {
        const fmt = (v) => Number(ethers.formatUnits(v, 6)).toFixed(4);
        setDrawerStatus(
          `Not enough USDC to pay for this sell. You have ${fmt(usdcForGas)} and need about `
          + `${fmt(needForSell)} for gas. On Arc gas is paid in USDC, so holding tokens is `
          + `not enough to sell them.`, "error");
        $("drawerConfirm").disabled = false;
        return;
      }

      // Separate approval from the USDC one above — selling requires approving the
      // FACTORY to move the TOKEN out of your wallet, a completely different
      // allowance than the USDC approval buying uses.
      const allowance = await withRetry(() => tokenContract.allowance(userAddress, FACTORY_ADDRESS), { onRetry });
      if (allowance < tokensIn) {
        setDrawerStatus('<span class="spinner"></span> Approving token for sale — confirm in your wallet…', "warn");
        const approveTx = await withRetry(async () => tokenContract.approve(FACTORY_ADDRESS, tokensIn, await currentFees()), { onRetry });
        setDrawerStatus('<span class="spinner"></span> Waiting for approval…', "warn");
        await withRetry(() => approveTx.wait(), { onRetry });
      }

      setDrawerStatus('<span class="spinner"></span> Confirm the sell in your wallet…', "warn");
      const tx = await withRetry(async () => factory.sell(activeToken.contract_address, tokensIn, minOut, await currentFees()), { onRetry });
      setDrawerStatus('<span class="spinner"></span> Waiting for confirmation…', "warn");
      await withRetry(() => tx.wait(), { onRetry });
      setDrawerStatus("✓ Sold. This may take a few seconds to reflect in the feed.", "ok");
    }

    $("drawerConfirm").textContent = "Done";
    setTimeout(closeDrawer, 1800);
  } catch (err) {
    // Was: err.shortMessage || err.reason || err.message || "Unknown error" -- which on
    // Arc resolves to "Unknown error" for EVERY contract revert, because ethers leaves all
    // three undefined and puts the selector in err.data.
    const explained = explainRevert(err, "The transaction failed and no reason was returned.");
    const msg = explained.message;
    setDrawerStatus("Failed: " + msg, "error");
    $("drawerConfirm").disabled = false;
  }
});

if (window.ethereum) {
  window.ethereum.on("accountsChanged", () => window.location.reload());
  window.ethereum.on("chainChanged", () => window.location.reload());
}

pollTokens();
setInterval(pollTokens, POLL_INTERVAL_MS);
</script>
</body>
</html>
